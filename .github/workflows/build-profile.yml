name: Build profile assets

on:
  schedule:
    - cron: "17 2 * * *"      # nightly, 02:17 UTC
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

# Two runs pushing to main at once lose the race. Queue rather than cancel — a
# cancelled run would leave the assets stale until the next schedule.
concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------
  # Agent roster + stats card. Both are regenerated from the live API, so
  # new repos appear here on their own.
  # --------------------------------------------------------------------
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify generators still pass their tests
        run: python -m pytest tests/ -q

      - name: Generate assets, commit, and push
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # These files are generated, never hand-edited, so a conflict with the
          # remote has exactly one correct resolution: discard local, take the
          # newest main, and regenerate on top of it. Rebasing generated binaries
          # produces conflicts that cannot be resolved automatically.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            python generate_repos.py
            python generate_stats.py

            git add repos-dark.svg repos-light.svg stats-dark.svg stats-light.svg
            if git diff --staged --quiet; then
              echo "assets unchanged — nothing to push"
              exit 0
            fi

            git commit --quiet -m "chore: refresh roster and stats"
            if git push --quiet; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            echo "remote moved during attempt $attempt, regenerating"
            sleep 5
          done

          echo "could not push after 3 attempts" >&2
          exit 1

  # --------------------------------------------------------------------
  # Contribution snake — travels the calendar eating contribution dots.
  # Recoloured to the inferno ramp. Pushes to `output`, not main, so it
  # never races the roster job.
  # --------------------------------------------------------------------
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F98E08&color_dots=#16130F,#570F6D,#BB3754,#E45A31,#F98E08
            dist/snake-light.svg?palette=github-light&color_snake=#C2410C&color_dots=#EFE6D8,#F8CB34,#F98E08,#BB3754,#570F6D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
