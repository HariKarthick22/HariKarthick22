name: Build profile assets

on:
  schedule:
    - cron: "17 2 * * *"      # nightly, 02:17 UTC
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------
  # Agent roster — repos as a model.summary() table.
  # Picks up new repos automatically; nothing here is hardcoded.
  # --------------------------------------------------------------------
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify generators still pass their tests
        run: python -m pytest tests/ -q

      - name: Generate agent roster
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_repos.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos-dark.svg repos-light.svg
          git diff --staged --quiet || git commit -m "chore: refresh agent roster"
          git push

  # --------------------------------------------------------------------
  # Contribution snake — travels the calendar eating contribution dots.
  # Recoloured to the inferno ramp so it matches the banner.
  # Output goes to the `output` branch, not main.
  # --------------------------------------------------------------------
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F98E08&color_dots=#16130F,#570F6D,#BB3754,#E45A31,#F98E08
            dist/snake-light.svg?palette=github-light&color_snake=#C2410C&color_dots=#EFE6D8,#F8CB34,#F98E08,#BB3754,#570F6D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
