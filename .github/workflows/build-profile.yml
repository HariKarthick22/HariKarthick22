name: Build profile assets

on:
  schedule:
    - cron: "17 2 * * *"      # nightly, 02:17 UTC
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify generators still pass their tests
        run: python -m pytest tests/ -q

      - name: Generate agent roster
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_repos.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos-dark.svg repos-light.svg
          git diff --staged --quiet || git commit -m "chore: refresh agent roster"
          git push
